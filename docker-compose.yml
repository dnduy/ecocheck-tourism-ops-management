services:
  app:
    build:
      context: ./backend-app
      dockerfile: Dockerfile
    image: ecocheck-app:latest
    container_name: ecocheck-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-EcoCheck}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ecocheck}"
      DB_USERNAME: "${DB_USERNAME:-ecocheck}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      VITE_API_URL: "${VITE_API_URL:-http://localhost/api}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost}"
    volumes:
      - ./backend-app/storage:/var/www/html/storage
      - ./backend-app/bootstrap/cache:/var/www/html/bootstrap/cache
      - static-assets:/var/www/html/public
    networks:
      - ecocheck-network

  web:
    image: nginx:alpine
    container_name: ecocheck-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
      - static-assets:/var/www/html/public
    depends_on:
      - app
    networks:
      - ecocheck-network

  db:
    image: mysql:8.0
    container_name: ecocheck-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ecocheck}"
      MYSQL_USER: "${DB_USERNAME:-ecocheck}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ecocheck-network

volumes:
  db-data:
  static-assets:

networks:
  ecocheck-network:
    driver: bridge
